<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Tu perfil internacional — Medical Pathway</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <nav><a href="/index.html">Inicio</a></nav>
  <h1>Cuéntanos sobre ti</h1>
  <p>Esto se completa una vez — a partir de aquí, tu recomendación y tu ruta se personalizan (Perfil Internacional).</p>
  <progress id="progreso" value="1" max="3"></progress>

  <section id="paso1">
    <h2>1 de 3 — Tu formación</h2>
    <label>Universidad</label>
    <input id="universidad" placeholder="Universidad Nacional de Colombia" />
    <label>País donde te graduaste (código, ej. CO)</label>
    <input id="paisGraduacion" placeholder="CO" maxlength="2" />
    <label>Tipo de título</label>
    <select id="tipoTitulo">
      <option value="pregrado">Pregrado (medicina general)</option>
      <option value="especialidad">Especialidad</option>
      <option value="subespecialidad">Subespecialidad</option>
    </select>
    <button onclick="siguientePaso1()">Siguiente</button>
  </section>

  <section id="paso2" style="display:none">
    <h2>2 de 3 — Idiomas que dominas (además del español)</h2>
    <label>Idioma</label>
    <select id="idioma">
      <option value="">(ninguno adicional)</option>
      <option value="ingles">Inglés</option>
      <option value="aleman">Alemán</option>
      <option value="portugues">Portugués</option>
      <option value="frances">Francés</option>
    </select>
    <label>Nivel</label>
    <select id="nivelIdioma">
      <option value="A1">A1</option>
      <option value="A2">A2</option>
      <option value="B1">B1</option>
      <option value="B2">B2</option>
      <option value="C1">C1</option>
      <option value="C2">C2</option>
      <option value="nativo">Nativo</option>
    </select>
    <button onclick="siguientePaso2()">Siguiente</button>
  </section>

  <section id="paso3" style="display:none">
    <h2>3 de 3 — Tus objetivos</h2>
    <label>¿Qué tan urgente es para ti empezar tu carrera internacional?</label>
    <select id="urgencia">
      <option value="alta">Alta — quiero avanzar lo antes posible</option>
      <option value="media">Media</option>
      <option value="baja">Baja — estoy explorando opciones</option>
    </select>
    <label>¿Prefieres una ruta más rápida pero competitiva, o más lenta pero segura?</label>
    <select id="tolerancia">
      <option value="prefiere_rapido_competitivo">Rápida y competitiva</option>
      <option value="prefiere_lento_seguro">Lenta pero segura</option>
    </select>
    <label>¿Qué priorizas: ingreso a largo plazo o rapidez para empezar a ejercer?</label>
    <select id="prioridad">
      <option value="ingreso_largo_plazo">Ingreso a largo plazo</option>
      <option value="rapidez_de_practica">Rapidez para ejercer</option>
    </select>
    <button onclick="finalizar()">Ver mi recomendación</button>
  </section>

  <p class="error" id="error"></p>

  <script src="/app.js"></script>
  <script>
    requireAuth();
    let pasoActual = 'formacion_academica';
    let completado = false;

    track('cuestionario_iniciado');

    function mostrarPaso(n, nombrePregunta) {
      document.getElementById('progreso').value = n;
      pasoActual = nombrePregunta;
    }

    async function siguientePaso1() {
      document.getElementById('error').textContent = '';
      try {
        await api('/perfil/me/formacion', {
          method: 'POST',
          body: JSON.stringify({
            universidad: document.getElementById('universidad').value.trim(),
            paisGraduacion: document.getElementById('paisGraduacion').value.trim().toUpperCase(),
            tipoTitulo: document.getElementById('tipoTitulo').value,
          }),
        });
        document.getElementById('paso1').style.display = 'none';
        document.getElementById('paso2').style.display = 'block';
        mostrarPaso(2, 'idiomas');
      } catch (e) {
        document.getElementById('error').textContent = e.message;
      }
    }

    async function siguientePaso2() {
      document.getElementById('error').textContent = '';
      try {
        const idioma = document.getElementById('idioma').value;
        if (idioma) {
          await api('/perfil/me/idiomas', {
            method: 'POST',
            body: JSON.stringify({ idioma, nivel: document.getElementById('nivelIdioma').value }),
          });
        }
        document.getElementById('paso2').style.display = 'none';
        document.getElementById('paso3').style.display = 'block';
        mostrarPaso(3, 'objetivos');
      } catch (e) {
        document.getElementById('error').textContent = e.message;
      }
    }

    async function finalizar() {
      document.getElementById('error').textContent = '';
      try {
        await api('/perfil/me/objetivos', {
          method: 'PUT',
          body: JSON.stringify({
            urgencia: document.getElementById('urgencia').value,
            toleranciaExamenCompetitivo: document.getElementById('tolerancia').value,
            prioridadIngresoVsRapidez: document.getElementById('prioridad').value,
          }),
        });
        completado = true;
        track('cuestionario_completado');
        window.location.href = '/resultados.html';
      } catch (e) {
        document.getElementById('error').textContent = e.message;
      }
    }

    // Abandono: si la página se oculta/cierra antes de completar el cuestionario,
    // se reporta en qué pregunta se quedó (ver H1, docs/16-hipotesis-sprint-1.md).
    // Se reporta una sola vez (el usuario puede cambiar de pestaña sin "abandonar").
    let abandonoReportado = false;
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden' && !completado && !abandonoReportado) {
        abandonoReportado = true;
        track('cuestionario_abandonado_en_pregunta', { pregunta: pasoActual });
      }
    });
  </script>
</body>
</html>
